<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台美股多組合攤平與損益計算器</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body id="bodyBg" class="bg-slate-100 text-slate-800 p-3 sm:p-6 min-h-screen transition-all">
  <div id="mainContainer" class="max-w-md sm:max-w-xl mx-auto space-y-4 sm:space-y-6 text-xs sm:text-sm relative z-10">
    
    <header class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between relative z-20">
      <div>
        <div class="flex items-center gap-2">
          <h1 class="font-bold text-sm sm:text-lg text-slate-900 leading-tight">台美股攤平與損益計算器</h1>
          <span class="bg-red-100 text-red-700 text-[10px] sm:text-xs font-bold px-2.5 py-0.5 rounded-full">v4.3.0</span>
        </div>
        <div id="syncStatus" class="text-[9px] sm:text-xs text-slate-400 mt-0.5">系統運作中...</div>
      </div>
      
      <div class="flex items-center gap-2.5 sm:gap-3">
        <button onclick="toggleUIMode()" id="modeToggleBtn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-[10px] sm:text-xs px-3 py-2 rounded-xl font-bold border transition shadow-sm cursor-pointer">
          📱 緊湊模式
        </button>

        <div class="flex items-center gap-1.5 relative z-30">
          <span id="userInfo" class="text-[10px] sm:text-xs text-slate-500 max-w-[90px] sm:max-w-[140px] truncate hidden sm:inline">未登入</span>
          <button id="loginBtn" type="button" class="bg-red-600 text-white text-[10px] sm:text-xs px-3.5 py-2 rounded-xl font-semibold hover:bg-red-700 cursor-pointer shadow">登入</button>
          <button id="logoutBtn" type="button" class="hidden bg-slate-200 text-slate-700 text-[10px] sm:text-xs px-3.5 py-2 rounded-xl font-semibold cursor-pointer shadow">登出</button>
        </div>
      </div>
    </header>

    <div class="bg-white p-3.5 sm:p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between gap-2.5">
      <select id="stockSelector" class="flex-1 border rounded-xl p-2.5 text-xs sm:text-sm font-bold text-red-600 bg-slate-50 outline-none">
        <option>2330 台積電 (主組合)</option>
      </select>
      <button class="bg-amber-50 text-amber-600 px-3.5 py-2.5 rounded-xl font-bold hover:bg-amber-100 text-[10px] sm:text-xs cursor-pointer">✏️ 改名</button>
      <button class="bg-red-50 text-red-600 px-3.5 py-2.5 rounded-xl font-bold hover:bg-red-100 text-[10px] sm:text-xs cursor-pointer">+ 新增</button>
      <button class="bg-rose-50 text-rose-600 px-3.5 py-2.5 rounded-xl font-bold hover:bg-rose-100 text-[10px] sm:text-xs cursor-pointer">刪除</button>
    </div>

    <!-- 介面恢復區塊 -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center space-y-4">
      <h2 class="text-lg font-bold text-slate-700">✅ 介面已完全恢復</h2>
      <p class="text-sm text-slate-500">已經幫你把介面恢復成原本的計算器架構，並且移除了會報錯的前端 AI 面板。現在一切將由 GitHub Actions 在背景為你代勞！</p>
      
      <button class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl text-xs sm:text-sm shadow transition cursor-pointer">
        這是一個紅色的主按鈕 (測試樣式)
      </button>
    </div>
  </div>

  <script>
    let isCompactMode = localStorage.getItem('calc_compact_mode') === 'true';
    
    window.toggleUIMode = function() {
      isCompactMode = !isCompactMode;
      localStorage.setItem('calc_compact_mode', isCompactMode);
      applyUIMode();
    };

    function applyUIMode() {
      const btn = document.getElementById('modeToggleBtn');
      if (isCompactMode) {
        btn.innerText = "📱 緊湊模式";
      } else {
        btn.innerText = "💻 標準模式";
      }
    }
    
    applyUIMode();
  </script>
</body>
</html>
