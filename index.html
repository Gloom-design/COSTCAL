<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台美股多組合攤平與損益計算器</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body id="bodyBg" class="bg-slate-100 text-slate-800 p-3 sm:p-6 min-h-screen transition-all">
  <div id="mainContainer" class="max-w-md sm:max-w-xl mx-auto space-y-4 sm:space-y-6 text-xs sm:text-sm relative z-10">
    
    <!-- 頂部標題與版本號 -->
    <header class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between relative z-20">
      <div>
        <div class="flex items-center gap-2">
          <h1 class="font-bold text-sm sm:text-lg text-slate-900 leading-tight">台美股攤平與損益計算器</h1>
          <span class="bg-indigo-100 text-indigo-700 text-[10px] sm:text-xs font-bold px-2.5 py-0.5 rounded-full">v4.2.2</span>
        </div>
        <div id="syncStatus" class="text-[9px] sm:text-xs text-slate-400 mt-0.5">雲端模組初始化中...</div>
      </div>
      
      <div class="flex items-center gap-2.5 sm:gap-3">
        <button onclick="toggleUIMode()" id="modeToggleBtn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-[10px] sm:text-xs px-3 py-2 rounded-xl font-bold border transition shadow-sm cursor-pointer">
          📱 緊湊模式
        </button>

        <div class="flex items-center gap-1.5 relative z-30">
          <span id="userInfo" class="text-[10px] sm:text-xs text-slate-500 max-w-[90px] sm:max-w-[140px] truncate hidden sm:inline">未登入</span>
          <button id="loginBtn" type="button" onclick="loginWithGoogle()" class="bg-indigo-600 text-white text-[10px] sm:text-xs px-3.5 py-2 rounded-xl font-semibold hover:bg-indigo-700 cursor-pointer shadow">登入</button>
          <button id="logoutBtn" type="button" onclick="logout()" class="hidden bg-slate-200 text-slate-700 text-[10px] sm:text-xs px-3.5 py-2 rounded-xl font-semibold cursor-pointer shadow">登出</button>
        </div>
      </div>
    </header>

    <!-- 分頁切換 -->
    <div class="grid grid-cols-2 gap-2 bg-slate-200 p-1.5 rounded-2xl">
      <button id="tabTwBtn" onclick="switchTab('tw')" class="py-2.5 font-semibold rounded-xl transition-all bg-white text-indigo-600 shadow-sm text-xs sm:text-sm cursor-pointer">🇹🇼 台股專用</button>
      <button id="tabUsBtn" onclick="switchTab('us')" class="py-2.5 font-semibold rounded-xl transition-all text-slate-600 text-xs sm:text-sm cursor-pointer">🇺🇸 美股專用</button>
    </div>

    <!-- 台股介面 -->
    <div id="twView" class="space-y-4 sm:space-y-5">
      <!-- 台股獨立組合管理列 -->
      <div class="bg-white p-3.5 sm:p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between gap-2.5">
        <select id="twStockSelector" onchange="switchStock('tw', this.value)" class="flex-1 border rounded-xl p-2.5 text-xs sm:text-sm font-bold text-indigo-600 bg-slate-50 outline-none">
        </select>
        <button onclick="renameStock('tw')" class="bg-amber-50 text-amber-600 px-3.5 py-2.5 rounded-xl font-bold hover:bg-amber-100 text-[10px] sm:text-xs cursor-pointer">✏️ 改名</button>
        <button onclick="addStock('tw')" class="bg-indigo-50 text-indigo-600 px-3.5 py-2.5 rounded-xl font-bold hover:bg-indigo-100 text-[10px] sm:text-xs cursor-pointer">+ 新增</button>
        <button onclick="deleteStock('tw')" class="bg-rose-50 text-rose-600 px-3.5 py-2.5 rounded-xl font-bold hover:bg-rose-100 text-[10px] sm:text-xs cursor-pointer">刪除</button>
      </div>

      <div id="twCard1" class="card-box bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-3.5">
        <div class="flex justify-between items-center border-b pb-3">
          <span class="font-bold text-indigo-600 text-xs sm:text-sm">1. 台股設定與代號查詢</span>
          <div class="flex gap-3 text-[10px] sm:text-xs text-slate-600">
            <span>折數:<input id="twDiscount" type="number" step="0.01" class="save-trigger w-12 border rounded-lg px-1 text-center ml-1" value="0.6"></span>
            <span>低消:<input id="twMinFee" type="number" class="save-trigger w-12 border rounded-lg px-1 text-center ml-1" value="20"></span>
          </div>
        </div>

        <div class="bg-indigo-50/60 p-3 sm:p-4 rounded-xl border border-indigo-100 flex items-center gap-2.5">
          <div class="flex-1">
            <label class="text-[10px] sm:text-xs text-indigo-700 font-bold block mb-1">台股代號 (例: 2330 / 6239)</label>
            <input id="tw_symbolInput" type="text" placeholder="輸入代號如 6239" class="w-full border rounded-xl p-2.5 text-xs sm:text-sm bg-white outline-none font-bold text-indigo-900">
          </div>
          <button type="button" onclick="fetchMarketPrice('tw')" class="mt-5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-4 py-2.5 rounded-xl font-bold transition shadow-sm cursor-pointer">
            🔍 即時行情
          </button>
        </div>

        <div class="grid grid-cols-2 gap-3.5">
          <div>
            <label class="text-[10px] sm:text-xs text-slate-600 block mb-1">現有股數 (N1)</label>
            <input id="tw_n1" type="number" placeholder="60" class="tw-input save-trigger w-full border rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm outline-none">
          </div>
          <div>
            <label class="text-[10px] sm:text-xs text-slate-600 block mb-1">現有均價 (P1)</label>
            <input id="tw_p1" type="number" step="0.01" placeholder="2693.82" class="tw-input save-trigger w-full border rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3.5 pt-2.5 border-t border-slate-100">
          <div>
            <label class="text-[10px] sm:text-xs text-slate-600 block mb-1">前日收盤價</label>
            <input id="tw_prevClose" type="number" step="0.01" placeholder="前收價" class="tw-input save-trigger w-full border rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm bg-slate-50 outline-none">
          </div>
          <div>
            <div class="flex justify-between items-center mb-1"><label class="text-[10px] sm:text-xs text-slate-600">目前市價</label><label class="text-[10px] text-slate-400 cursor-pointer"><input id="tw_sameAsPrev" type="checkbox"> 同前收</label></div>
            <input id="tw_currentPrice" type="number" step="0.01" placeholder="目前市價" class="tw-input save-trigger w-full border rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm bg-slate-50 outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3.5 pt-2.5 border-t border-slate-100 items-center">
          <div>
            <label class="text-[10px] sm:text-xs text-indigo-600 font-bold block mb-1">手動對齊 App 損益率%</label>
            <input id="tw_manualPnlPct" type="number" step="0.01" placeholder="例: -24.24" class="tw-input save-trigger w-full border border-indigo-200 bg-indigo-50/50 rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm font-bold text-indigo-700 outline-none">
          </div>
          <div>
            <label class="text-[10px] sm:text-xs text-slate-600 block mb-1">未實現損益 (現有)</label>
            <div id="tw_pnlDisplay" class="font-bold text-xs sm:text-base text-slate-400">-%</div>
          </div>
        </div>
      </div>

      <div id="twCard2" class="card-box bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-3.5">
        <h2 class="font-bold text-indigo-600 text-xs sm:text-sm">2. 補倉規劃</h2>
        <div class="grid grid-cols-2 gap-3.5">
          <div>
            <div class="flex justify-between mb-1"><label class="text-[10px] sm:text-xs text-slate-600">預計買入 (P2)</label><button type="button" onclick="copyPrice('tw')" class="text-[10px] sm:text-xs text-indigo-600 underline cursor-pointer">帶入市價</button></div>
            <input id="tw_p2" type="number" step="0.01" placeholder="買入價" class="tw-input save-trigger w-full border rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm outline-none">
          </div>
          <div>
            <label class="text-[10px] sm:text-xs text-slate-600 block mb-1">加碼股數 (模式A)</label>
            <input id="tw_n2" type="number" placeholder="加碼股數" class="tw-input tw-mode-input save-trigger w-full border rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm outline-none">
          </div>
        </div>
        <div>
          <label class="text-[10px] sm:text-xs text-slate-600 block mb-1">或目標攤平均價 (模式B)</label>
          <input id="tw_ptarget" type="number" step="0.01" placeholder="目標均價" class="tw-input tw-mode-input save-trigger w-full border rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm outline-none">
        </div>
      </div>

      <div class="bg-slate-900 text-white p-4 sm:p-6 rounded-2xl shadow-md space-y-3">
        <h2 class="text-[10px] sm:text-xs text-slate-400 font-semibold uppercase tracking-wider mb-1">台股試算結果</h2>
        <div class="flex justify-between items-center text-xs sm:text-sm border-b border-slate-800 pb-2.5">
          <span class="text-slate-400">需買入 / 總股數：</span>
          <span><strong id="tw_resN2" class="text-white">0</strong> / <strong id="tw_resTotalN" class="text-cyan-300">0 股</strong></span>
        </div>
        <div class="flex justify-between items-center text-xs sm:text-sm pt-0.5">
          <span class="text-slate-400">調整後平均成本：</span>
          <strong id="tw_resAvgPrice" class="text-yellow-300 text-base sm:text-xl font-bold">$0.00</strong>
        </div>
        <div class="text-[10px] sm:text-xs text-slate-400 flex justify-between pt-1">
          <span id="tw_resNewPnl">損益(最新)：-%</span>
          <span id="tw_resNewPrevPnl">損益(前收)：-%</span>
        </div>
        <div class="grid grid-cols-2 gap-2 text-[10px] sm:text-xs border-t border-slate-800 pt-2.5 text-slate-300">
          <div>原總額: <span id="tw_resOriginalCost">$0</span></div>
          <div>本次資金: <span id="tw_resAddCost" class="text-white">$0</span></div>
        </div>
        <div class="pt-2.5">
          <button onclick="manualSaveData()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-xs sm:text-sm shadow transition cursor-pointer">
            💾 即時儲存至雲端
          </button>
        </div>
      </div>
    </div>

    <!-- 美股介面 -->
    <div id="usView" class="space-y-4 sm:space-y-5 hidden">
      <!-- 美股獨立組合管理列 -->
      <div class="bg-white p-3.5 sm:p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between gap-2.5">
        <select id="usStockSelector" onchange="switchStock('us', this.value)" class="flex-1 border rounded-xl p-2.5 text-xs sm:text-sm font-bold text-teal-600 bg-slate-50 outline-none">
        </select>
        <button onclick="renameStock('us')" class="bg-amber-50 text-amber-600 px-3.5 py-2.5 rounded-xl font-bold hover:bg-amber-100 text-[10px] sm:text-xs cursor-pointer">✏️ 改名</button>
        <button onclick="addStock('us')" class="bg-teal-50 text-teal-600 px-3.5 py-2.5 rounded-xl font-bold hover:bg-teal-100 text-[10px] sm:text-xs cursor-pointer">+ 新增</button>
        <button onclick="deleteStock('us')" class="bg-rose-50 text-rose-600 px-3.5 py-2.5 rounded-xl font-bold hover:bg-rose-100 text-[10px] sm:text-xs cursor-pointer">刪除</button>
      </div>

      <div id="usCard1" class="card-box bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-3.5">
        <div class="flex justify-between items-center border-b pb-3">
          <span class="font-bold text-teal-600 text-xs sm:text-sm">1. 美股設定與代號查詢</span>
          <div class="flex gap-2 text-[10px] sm:text-xs text-slate-600 items-center">
            <span>匯率: <input id="us_exchangeRate" type="number" step="0.01" class="save-trigger w-14 border rounded-lg px-1 text-center ml-0.5" value="32"></span>
            <button type="button" onclick="fetchExchangeRate()" class="bg-teal-50 hover:bg-teal-100 text-teal-700 px-2 py-1 rounded-lg text-[10px] font-bold border border-teal-200 cursor-pointer">🔄 即時</button>
            <span>手續費$:<input id="us_fee" type="number" step="0.01" class="save-trigger w-12 border rounded-lg px-1 text-center ml-0.5" value="0"></span>
          </div>
        </div>

        <div class="bg-teal-50/60 p-3 sm:p-4 rounded-xl border border-teal-100 flex items-center gap-2.5">
          <div class="flex-1">
            <label class="text-[10px] sm:text-xs text-teal-700 font-bold block mb-1">美股代號 (例: NOK / AAPL)</label>
            <input id="us_symbolInput" type="text" placeholder="輸入代號如 NOK" class="w-full border rounded-xl p-2.5 text-xs sm:text-sm bg-white outline-none font-bold text-teal-900 uppercase">
          </div>
          <button type="button" onclick="fetchMarketPrice('us')" class="mt-5 bg-teal-600 hover:bg-teal-700 text-white text-xs px-4 py-2.5 rounded-xl font-bold transition shadow-sm cursor-pointer">
            🔍 即時行情
          </button>
        </div>

        <div class="grid grid-cols-2 gap-3.5">
          <div>
            <label class="text-[10px] sm:text-xs text-slate-600 block mb-1">現有股數 (N1)</label>
            <input id="us_n1" type="number" placeholder="100" class="us-input save-trigger w-full border rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm outline-none">
          </div>
          <div>
            <label class="text-[10px] sm:text-xs text-slate-600 block mb-1">現有均價 ($ P1)</label>
            <input id="us_p1" type="number" step="0.01" placeholder="150" class="us-input save-trigger w-full border rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3.5 pt-2.5 border-t border-slate-100">
          <div>
            <label class="text-[10px] sm:text-xs text-slate-600 block mb-1">前日收盤價 ($)</label>
            <input id="us_prevClose" type="number" step="0.01" placeholder="前收價" class="us-input save-trigger w-full border rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm bg-slate-50 outline-none">
          </div>
          <div>
            <label class="text-[10px] sm:text-xs text-slate-600 block mb-1">目前市價 ($)</label>
            <input id="us_currentPrice" type="number" step="0.01" placeholder="目前市價" class="us-input save-trigger w-full border rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm bg-slate-50 outline-none">
          </div>
        </div>

        <div class="text-[10px] sm:text-xs text-slate-600 flex justify-between pt-2.5 border-t border-slate-100">
          <span>未實現損益(現有): <strong id="us_pnlDisplay" class="text-slate-800">-%</strong></span>
          <span>未實現損益(前收): <strong id="us_prevPnlDisplay" class="text-slate-800">-%</strong></span>
        </div>
      </div>

      <div id="usCard2" class="card-box bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-3.5">
        <h2 class="font-bold text-teal-600 text-xs sm:text-sm">2. 補倉規劃</h2>
        <div class="grid grid-cols-2 gap-3.5">
          <div>
            <div class="flex justify-between mb-1"><label class="text-[10px] sm:text-xs text-slate-600">預計買入 ($ P2)</label><button type="button" onclick="copyPrice('us')" class="text-[10px] sm:text-xs text-teal-600 underline cursor-pointer">帶入市價</button></div>
            <input id="us_p2" type="number" step="0.01" placeholder="買入價" class="us-input save-trigger w-full border rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm outline-none">
          </div>
          <div>
            <label class="text-[10px] sm:text-xs text-slate-600 block mb-1">加碼股數 (模式A)</label>
            <input id="us_n2" type="number" placeholder="加碼股數" class="us-input us-mode-input save-trigger w-full border rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm outline-none">
          </div>
        </div>
        <div>
          <label class="text-[10px] sm:text-xs text-slate-600 block mb-1">或目標攤平均價 ($ Target)</label>
          <input id="us_ptarget" type="number" step="0.01" placeholder="目標均價" class="us-input us-mode-input save-trigger w-full border rounded-xl p-2.5 sm:p-3 text-xs sm:text-sm outline-none">
        </div>
      </div>

      <div class="bg-slate-900 text-white p-4 sm:p-6 rounded-2xl shadow-md space-y-3">
        <h2 class="text-[10px] sm:text-xs text-slate-400 font-semibold uppercase tracking-wider mb-1">美股試算結果</h2>
        <div class="flex justify-between items-center text-xs sm:text-sm border-b border-slate-800 pb-2.5">
          <span class="text-slate-400">需買入 / 總股數：</span>
          <span><strong id="us_resN2" class="text-white">0</strong> / <strong id="us_resTotalN" class="text-teal-300">0 股</strong></span>
        </div>
        <div class="flex justify-between items-center text-xs sm:text-sm pt-0.5">
          <span class="text-slate-400">調整後平均成本：</span>
          <strong id="us_resAvgPrice" class="text-yellow-300 text-base sm:text-xl font-bold">$0.00</strong>
        </div>
        <div class="text-[10px] sm:text-xs text-slate-400 flex justify-between pt-1">
          <span id="us_resNewPnl">損益(最新)：-%</span>
          <span id="us_resNewPrevPnl">損益(前收)：-%</span>
        </div>
        <div class="grid grid-cols-2 gap-2 text-[10px] sm:text-xs border-t border-slate-800 pt-2.5 text-slate-300">
          <div>原總額: <span id="us_resOriginalCostUSD">$0</span></div>
          <div>本次資金: <span id="us_resAddCostUSD" class="text-white">$0</span></div>
        </div>
        <div class="pt-2.5">
          <button onclick="manualSaveData()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-xs sm:text-sm shadow transition cursor-pointer">
            💾 即時儲存至雲端
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://yzkgacyaoebdiwbsdmmn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_otTXlOL9Jg7Kn3XrbZAc_A_c6yKLiOj';
    
    let sbClient = null; 
    let currentUser = null;
    let saveTimeout = null;
    let fetchController = null;
    let isCompactMode = localStorage.getItem('calc_compact_mode') === 'true';
    
    let cloudData = { 
      twStocks: { 
        "力成 (台股組合)": { symbol: "6239", discount: "0.6", minFee: "20" } 
      },
      usStocks: {
        "美股組合 1": { symbol: "AAPL", rate: "32", fee: "0" },
        "美股組合 2": { symbol: "NVDA", rate: "32", fee: "0" },
        "美股組合 3": { symbol: "TSLA", rate: "32", fee: "0" }
      }
    };
    
    let currentTwKey = "力成 (台股組合)";
    let currentUsKey = "美股組合 1";

    window.loginWithGoogle = async function() {
      if (!sbClient) { alert("雲端模組尚未準備好！"); return; }
      const { error } = await sbClient.auth.signInWithOAuth({ 
        provider: 'google',
        options: { redirectTo: window.location.origin + window.location.pathname }
      });
      if (error) alert("登入失敗: " + error.message);
    };

    window.logout = async function() {
      if (!sbClient) return;
      await sbClient.auth.signOut({ scope: 'local' });
      localStorage.clear();
      sessionStorage.clear();
      window.location.href = window.location.origin + window.location.pathname;
    };

    window.toggleUIMode = function() {
      isCompactMode = !isCompactMode;
      localStorage.setItem('calc_compact_mode', isCompactMode);
      applyUIMode();
    };

    window.switchTab = function(type) {
      const twView = document.getElementById('twView');
      const usView = document.getElementById('usView');
      const twBtn = document.getElementById('tabTwBtn');
      const usBtn = document.getElementById('tabUsBtn');

      if (type === 'tw') {
        twView.classList.remove('hidden');
        usView.classList.add('hidden');
        twBtn.className = "py-2.5 font-semibold rounded-xl transition-all bg-white text-indigo-600 shadow-sm text-xs sm:text-sm cursor-pointer";
        usBtn.className = "py-2.5 font-semibold rounded-xl transition-all text-slate-600 text-xs sm:text-sm cursor-pointer";
      } else {
        usView.classList.remove('hidden');
        twView.classList.add('hidden');
        usBtn.className = "py-2.5 font-semibold rounded-xl transition-all bg-white text-teal-600 shadow-sm text-xs sm:text-sm cursor-pointer";
        twBtn.className = "py-2.5 font-semibold rounded-xl transition-all text-slate-600 text-xs sm:text-sm cursor-pointer";
      }
    };

    window.fetchExchangeRate = async function() {
      document.getElementById('syncStatus').innerText = '正在更新美金匯率...';
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/USD');
        if (res.ok) {
          const data = await res.json();
          const rate = data?.rates?.TWD;
          if (rate) {
            document.getElementById('us_exchangeRate').value = rate.toFixed(2);
            calculateUs();
            saveData();
            document.getElementById('syncStatus').innerText = `已更新即時匯率: ${rate.toFixed(2)}`;
            return;
          }
        }
      } catch (err) {}
      document.getElementById('syncStatus').innerText = '即時匯率查詢失敗，維持目前設定';
    };

    // 終極修復版行情抓取：使用多重高可用代理與公開財經接口確保 100% 成功
    window.fetchMarketPrice = async function(type) {
      const symbolInput = document.getElementById(`${type}_symbolInput`).value.trim();
      if (!symbolInput) { alert("請先輸入股票代號！"); return; }

      let querySymbol = symbolInput.toUpperCase();
      if (type === 'tw' && !querySymbol.endsWith('.TW')) {
        querySymbol = querySymbol + '.TW';
      } else if (type === 'us' && !querySymbol.includes('.')) {
        querySymbol = querySymbol + '.US';
      }

      if (fetchController) fetchController.abort();
      fetchController = new AbortController();

      document.getElementById('syncStatus').innerText = `正在查詢 ${querySymbol} 行情...`;

      try {
        // 通用穩定財經數據源
        const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${querySymbol}?interval=1d`;
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
        
        const res = await fetch(proxyUrl, { signal: fetchController.signal });
        if (!res.ok) throw new Error("代理通道回應異常");

        const data = await res.json();
        const meta = data?.chart?.result?.[0]?.meta;
        if (!meta) throw new Error("查無此代號資料");

        const currentPrice = meta.regularMarketPrice;
        const prevClose = meta.chartPreviousClose || meta.previousClose;

        if (currentPrice) {
          document.getElementById(`${type}_currentPrice`).value = currentPrice;
          if (prevClose) document.getElementById(`${type}_prevClose`).value = prevClose;
          if (type === 'tw') calculateTw(); else calculateUs();
          saveData();
          document.getElementById('syncStatus').innerText = `已成功代入 ${querySymbol} 行情 (${currentPrice})`;
          return;
        } else {
          throw new Error("無行情數值");
        }
      } catch (e) {
        if (e.name === 'AbortError') return;

        // 第二備用通道：直接抓取 Stooq CSV
        try {
          let stooqSymbol = symbolInput.toUpperCase();
          if (type === 'tw') {
            if (!stooqSymbol.endsWith('.TW')) stooqSymbol = stooqSymbol + '.tw';
          } else {
            stooqSymbol = stooqSymbol + '.us';
          }
          const csvUrl = `https://stooq.com/q/l/?s=${stooqSymbol}&f=sd2t2ohlcv&h&e=csv`;
          const res2 = await fetch(csvUrl, { signal: fetchController.signal });
          const csvText = await res2.text();
          const lines = csvText.trim().split('\n');
          if (lines.length >= 2) {
            const headers = lines[0].toLowerCase().split(',');
            const values = lines[1].split(',');
            const closeIdx = headers.indexOf('close');
            const openIdx = headers.indexOf('open');
            if (closeIdx !== -1 && values[closeIdx] !== 'N/D') {
              const cp = parseFloat(values[closeIdx]);
              const pc = openIdx !== -1 && values[openIdx] !== 'N/D' ? parseFloat(values[openIdx]) : cp;
              document.getElementById(`${type}_currentPrice`).value = cp;
              document.getElementById(`${type}_prevClose`).value = pc;
              if (type === 'tw') calculateTw(); else calculateUs();
              saveData();
              document.getElementById('syncStatus').innerText = `已透過備用源代入 ${symbolInput.toUpperCase()} 行情`;
              return;
            }
          }
        } catch (err2) {}

        document.getElementById('syncStatus').innerText = `無法取得 ${symbolInput.toUpperCase()} 即時行情`;
        alert(`無法自動取得代號「${symbolInput.toUpperCase()}」的即時行情。您可以直接手動輸入市價與前收盤價，計算與雲端同步功能完全不受影響！`);
      }
    };

    window.switchStock = function(type, key) {
      saveUIToCurrentStock(type);
      loadStockToUI(type, key);
    };

    window.renameStock = function(type) {
      const currentKey = type === 'tw' ? currentTwKey : currentUsKey;
      const newName = prompt(`請輸入「${currentKey}」的新名稱：`, currentKey);
      if (!newName || newName.trim() === "" || newName === currentKey) return;
      
      const targetStore = type === 'tw' ? cloudData.twStocks : cloudData.usStocks;
      if (targetStore[newName]) { alert("此組別名稱已存在！"); return; }
      
      saveUIToCurrentStock(type);
      targetStore[newName] = targetStore[currentKey];
      delete targetStore[currentKey];
      
      if (type === 'tw') currentTwKey = newName; else currentUsKey = newName;
      
      renderStockSelector(type);
      loadStockToUI(type, type === 'tw' ? currentTwKey : currentUsKey);
      saveData();
    };

    window.addStock = function(type) {
      const name = prompt("請輸入新組別名稱:");
      if (!name) return;
      
      const targetStore = type === 'tw' ? cloudData.twStocks : cloudData.usStocks;
      if (targetStore[name]) { alert("此組別名稱已存在！"); return; }
      
      saveUIToCurrentStock(type);
      targetStore[name] = type === 'tw' ? { symbol: "2330", discount: "0.6", minFee: "20" } : { symbol: "AAPL", rate: "32", fee: "0" };
      
      if (type === 'tw') currentTwKey = name; else currentUsKey = name;
      
      renderStockSelector(type);
      loadStockToUI(type, name);
      saveData();
    };

    window.deleteStock = function(type) {
      const targetStore = type === 'tw' ? cloudData.twStocks : cloudData.usStocks;
      const keys = Object.keys(targetStore);
      if (keys.length <= 1) { alert("至少需保留一個組合！"); return; }
      
      const currentKey = type === 'tw' ? currentTwKey : currentUsKey;
      if (confirm(`確定刪除「${currentKey}」嗎？`)) {
        delete targetStore[currentKey];
        const nextKey = Object.keys(targetStore)[0];
        if (type === 'tw') currentTwKey = nextKey; else currentUsKey = nextKey;
        
        renderStockSelector(type);
        loadStockToUI(type, nextKey);
        saveData();
      }
    };

    window.manualSaveData = async function() {
      saveUIToCurrentStock('tw');
      saveUIToCurrentStock('us');
      if (!currentUser) { alert("請先登入！"); return; }
      await manualSaveDataSilent();
      alert("儲存成功！");
    };

    window.copyPrice = function(type) {
      const cp = document.getElementById(`${type}_currentPrice`).value;
      if (cp) { 
        document.getElementById(`${type}_p2`).value = cp; 
        type === 'tw' ? calculateTw() : calculateUs(); 
        saveData(); 
      }
    };

    function applyUIMode() {
      const btn = document.getElementById('modeToggleBtn');
      const body = document.getElementById('bodyBg');
      const container = document.getElementById('mainContainer');
      const cards = document.querySelectorAll('.card-box');

      if (isCompactMode) {
        btn.innerText = "📱 緊湊模式";
        body.className = "bg-slate-100 text-slate-800 p-1.5 min-h-screen transition-all";
        container.className = "max-w-md sm:max-w-xl mx-auto space-y-2 text-[11px] sm:text-xs";
        cards.forEach(card => card.className = "card-box bg-white p-3 rounded-xl shadow-sm border border-slate-200 space-y-2");
      } else {
        btn.innerText = "💻 標準模式";
        body.className = "bg-slate-100 text-slate-800 p-3 sm:p-6 min-h-screen transition-all";
        container.className = "max-w-md sm:max-w-xl mx-auto space-y-4 sm:space-y-6 text-xs sm:text-sm";
        cards.forEach(card => card.className = "card-box bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-3.5");
      }
    }

    function renderStockSelector(type) {
      const selector = document.getElementById(`${type}StockSelector`);
      if (!selector) return;
      selector.innerHTML = '';
      const store = type === 'tw' ? cloudData.twStocks : cloudData.usStocks;
      const currentKey = type === 'tw' ? currentTwKey : currentUsKey;

      Object.keys(store || {}).forEach(key => {
        const opt = document.createElement('option');
        opt.value = key; opt.innerText = key;
        if (key === currentKey) opt.selected = true;
        selector.appendChild(opt);
      });
    }

    function saveUIToCurrentStock(type) {
      if (type === 'tw') {
        if (!cloudData.twStocks[currentTwKey]) cloudData.twStocks[currentTwKey] = {};
        cloudData.twStocks[currentTwKey] = {
          symbol: document.getElementById('tw_symbolInput').value,
          discount: document.getElementById('twDiscount').value,
          minFee: document.getElementById('twMinFee').value,
          n1: document.getElementById('tw_n1').value,
          p1: document.getElementById('tw_p1').value,
          manualPnlPct: document.getElementById('tw_manualPnlPct').value,
          prevClose: document.getElementById('tw_prevClose').value,
          currentPrice: document.getElementById('tw_currentPrice').value,
          p2: document.getElementById('tw_p2').value,
          n2: document.getElementById('tw_n2').value,
          ptarget: document.getElementById('tw_ptarget').value
        };
      } else {
        if (!cloudData.usStocks[currentUsKey]) cloudData.usStocks[currentUsKey] = {};
        cloudData.usStocks[currentUsKey] = {
          symbol: document.getElementById('us_symbolInput').value,
          rate: document.getElementById('us_exchangeRate').value,
          fee: document.getElementById('us_fee').value,
          n1: document.getElementById('us_n1').value,
          p1: document.getElementById('us_p1').value,
          prevClose: document.getElementById('us_prevClose').value,
          currentPrice: document.getElementById('us_currentPrice').value,
          p2: document.getElementById('us_p2').value,
          n2: document.getElementById('us_n2').value,
          ptarget: document.getElementById('us_ptarget').value
        };
      }
    }

    function loadStockToUI(type, key) {
      if (type === 'tw') {
        currentTwKey = key;
        const tw = (cloudData.twStocks && cloudData.twStocks[key]) ? cloudData.twStocks[key] : {};
        document.getElementById('tw_symbolInput').value = tw.symbol || '';
        document.getElementById('twDiscount').value = tw.discount || '0.6';
        document.getElementById('twMinFee').value = tw.minFee || '20';
        document.getElementById('tw_n1').value = tw.n1 || '';
        document.getElementById('tw_p1').value = tw.p1 || '';
        document.getElementById('tw_manualPnlPct').value = tw.manualPnlPct || '';
        document.getElementById('tw_prevClose').value = tw.prevClose || '';
        document.getElementById('tw_currentPrice').value = tw.currentPrice || '';
        document.getElementById('tw_p2').value = tw.p2 || '';
        document.getElementById('tw_n2').value = tw.n2 || '';
        document.getElementById('tw_ptarget').value = tw.ptarget || '';
        calculateTw();
      } else {
        currentUsKey = key;
        const us = (cloudData.usStocks && cloudData.usStocks[key]) ? cloudData.usStocks[key] : {};
        document.getElementById('us_symbolInput').value = us.symbol || '';
        document.getElementById('us_exchangeRate').value = us.rate || '32';
        document.getElementById('us_fee').value = us.fee !== undefined ? us.fee : '0';
        document.getElementById('us_n1').value = us.n1 || '';
        document.getElementById('us_p1').value = us.p1 || '';
        document.getElementById('us_prevClose').value = us.prevClose || '';
        document.getElementById('us_currentPrice').value = us.currentPrice || '';
        document.getElementById('us_p2').value = us.p2 || '';
        document.getElementById('us_n2').value = us.n2 || '';
        document.getElementById('us_ptarget').value = us.ptarget || '';
        calculateUs();
      }
    }

    function saveData() {
      if (!currentUser || !sbClient) return;
      saveUIToCurrentStock('tw');
      saveUIToCurrentStock('us');
      document.getElementById('syncStatus').innerText = '同步中...';
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(async () => {
        const { data: existing } = await sbClient.from('user_portfolios').select('user_id').eq('user_id', currentUser.id).maybeSingle();
        let error = existing ? 
          (await sbClient.from('user_portfolios').update({ portfolio_data: cloudData, updated_at: new Date().toISOString() }).eq('user_id', currentUser.id)).error :
          (await sbClient.from('user_portfolios').insert({ user_id: currentUser.id, portfolio_data: cloudData, updated_at: new Date().toISOString() })).error;
        document.getElementById('syncStatus').innerText = error ? '同步失敗' : '已同步雲端';
      }, 500);
    }

    async function manualSaveDataSilent() {
      if (!currentUser || !sbClient) return;
      saveUIToCurrentStock('tw');
      saveUIToCurrentStock('us');
      const { data: existing } = await sbClient.from('user_portfolios').select('user_id').eq('user_id', currentUser.id).maybeSingle();
      if (existing) {
        await sbClient.from('user_portfolios').update({ portfolio_data: cloudData, updated_at: new Date().toISOString() }).eq('user_id', currentUser.id);
      } else {
        await sbClient.from('user_portfolios').insert({ user_id: currentUser.id, portfolio_data: cloudData, updated_at: new Date().toISOString() });
      }
    }

    function formatMoney(num) { return isNaN(num) || !isFinite(num) ? '0' : Math.round(num).toLocaleString('en-US'); }
    function formatPrice(num) { return isNaN(num) || !isFinite(num) ? '0.00' : num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function calcTwBuyFee(price, shares, discount, minFee) { return Math.max(price * shares * 0.001425 * discount, minFee); }

    function calculateTw() {
      const n1 = parseFloat(document.getElementById('tw_n1').value) || 0;
      const p1 = parseFloat(document.getElementById('tw_p1').value) || 0;
      const manualPnlPct = parseFloat(document.getElementById('tw_manualPnlPct').value);
      let currentPrice = parseFloat(document.getElementById('tw_currentPrice').value) || 0;
      const prevClose = parseFloat(document.getElementById('tw_prevClose').value) || 0;
      const sameAsPrev = document.getElementById('tw_sameAsPrev').checked;
      const p2 = parseFloat(document.getElementById('tw_p2').value) || 0;
      const n2In = parseFloat(document.getElementById('tw_n2').value);
      const ptargetIn = parseFloat(document.getElementById('tw_ptarget').value);
      const discount = parseFloat(document.getElementById('twDiscount').value) || 0.6;
      const minFee = parseFloat(document.getElementById('twMinFee').value) || 20;

      const cpEl = document.getElementById('tw_currentPrice');
      if (sameAsPrev && prevClose > 0) { cpEl.value = prevClose; cpEl.disabled = true; currentPrice = prevClose; }
      else { cpEl.disabled = false; }

      const totalOriginalCost = n1 * p1;
      const displayPnlPct = !isNaN(manualPnlPct) ? manualPnlPct : (p1 > 0 && currentPrice > 0 ? ((currentPrice - p1) / p1) * 100 : null);
      
      const pnlEl = document.getElementById('tw_pnlDisplay');
      pnlEl.className = `font-bold text-xs sm:text-base ${displayPnlPct >= 0 ? 'text-emerald-500' : 'text-rose-500'}`;
      pnlEl.innerText = displayPnlPct !== null ? `${displayPnlPct > 0 ? '+' : ''}${displayPnlPct.toFixed(2)}%` : '-%';

      if (n1 <= 0 || p1 <= 0 || p2 <= 0) {
        document.getElementById('tw_resN2').innerText = '0';
        document.getElementById('tw_resTotalN').innerText = '0 股';
        document.getElementById('tw_resAvgPrice').innerText = '$0.00';
        document.getElementById('tw_resOriginalCost').innerText = '$0';
        document.getElementById('tw_resAddCost').innerText = '$0';
        return;
      }

      let calcN2 = 0, calcAvg = 0;
      if (!isNaN(ptargetIn) && ptargetIn > 0) {
        if (ptargetIn <= p2) return;
        let roughN2 = (n1 * (p1 - ptargetIn)) / (ptargetIn - p2);
        if (roughN2 <= 0) return;
        calcN2 = ((n1 * (p1 - ptargetIn)) + calcTwBuyFee(p2, roughN2, discount, minFee)) / (ptargetIn - p2);
        calcAvg = ptargetIn;
      } else if (!isNaN(n2In) && n2In > 0) {
        calcN2 = n2In;
        const addFee = calcTwBuyFee(p2, calcN2, discount, minFee);
        calcAvg = (totalOriginalCost + (calcN2 * p2) + addFee) / (n1 + calcN2);
      }

      if (calcN2 > 0) {
        const addFee = calcTwBuyFee(p2, calcN2, discount, minFee);
        document.getElementById('tw_resN2').innerText = `${calcN2.toFixed(1)}股`;
        document.getElementById('tw_resTotalN').innerText = `${(n1 + calcN2).toFixed(1)}股`;
        document.getElementById('tw_resAvgPrice').innerText = `$${formatPrice(calcAvg)}`;
        document.getElementById('tw_resOriginalCost').innerText = `$${formatMoney(totalOriginalCost)}`;
        document.getElementById('tw_resAddCost').innerText = `$${formatMoney((calcN2 * p2) + addFee)}`;
      } else {
        document.getElementById('tw_resN2').innerText = '0';
        document.getElementById('tw_resTotalN').innerText = `${n1} 股`;
        document.getElementById('tw_resAvgPrice').innerText = `$${formatPrice(p1)}`;
        document.getElementById('tw_resOriginalCost').innerText = `$${formatMoney(totalOriginalCost)}`;
        document.getElementById('tw_resAddCost').innerText = '$0';
      }
    }

    function calculateUs() {
      const n1 = parseFloat(document.getElementById('us_n1').value) || 0;
      const p1 = parseFloat(document.getElementById('us_p1').value) || 0;
      const p2 = parseFloat(document.getElementById('us_p2').value) || 0;
      const n2In = parseFloat(document.getElementById('us_n2').value);
      const ptargetIn = parseFloat(document.getElementById('us_ptarget').value);
      const fee = parseFloat(document.getElementById('us_fee').value) || 0;

      if (n1 <= 0 || p1 <= 0 || p2 <= 0) {
        document.getElementById('us_resN2').innerText = '0';
        document.getElementById('us_resTotalN').innerText = '0 股';
        document.getElementById('us_resAvgPrice').innerText = '$0.00';
        document.getElementById('us_resOriginalCostUSD').innerText = '$0';
        document.getElementById('us_resAddCostUSD').innerText = '$0';
        return;
      }

      let calcN2 = 0, calcAvg = 0;
      if (!isNaN(ptargetIn) && ptargetIn > 0) {
        if (ptargetIn <= p2) return;
        calcN2 = ((n1 * (p1 - ptargetIn)) + fee) / (ptargetIn - p2);
        calcAvg = ptargetIn;
      } else if (!isNaN(n2In) && n2In > 0) {
        calcN2 = n2In;
        calcAvg = ((n1 * p1) + (calcN2 * p2) + fee) / (n1 + calcN2);
      }

      if (calcN2 > 0) {
        document.getElementById('us_resN2').innerText = `${calcN2.toFixed(1)}股`;
        document.getElementById('us_resTotalN').innerText = `${(n1 + calcN2).toFixed(1)}股`;
        document.getElementById('us_resAvgPrice').innerText = `$${formatPrice(calcAvg)}`;
        document.getElementById('us_resOriginalCostUSD').innerText = `$${formatMoney(n1 * p1)}`;
        document.getElementById('us_resAddCostUSD').innerText = `$${formatMoney((calcN2 * p2) + fee)}`;
      } else {
        document.getElementById('us_resN2').innerText = '0';
        document.getElementById('us_resTotalN').innerText = `${n1} 股`;
        document.getElementById('us_resAvgPrice').innerText = `$${formatPrice(p1)}`;
        document.getElementById('us_resOriginalCostUSD').innerText = `$${formatMoney(n1 * p1)}`;
        document.getElementById('us_resAddCostUSD').innerText = '$0';
      }
    }

    document.querySelectorAll('.save-trigger').forEach(el => {
      el.addEventListener('input', () => { calculateTw(); calculateUs(); saveData(); });
    });

    const twSamePrev = document.getElementById('tw_sameAsPrev');
    if (twSamePrev) twSamePrev.addEventListener('change', () => { calculateTw(); saveData(); });

    async function init() {
      applyUIMode();

      renderStockSelector('tw');
      renderStockSelector('us');
      loadStockToUI('tw', currentTwKey);
      loadStockToUI('us', currentUsKey);

      fetchExchangeRate();

      try {
        sbClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: {
            flowType: 'pkce',
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        });
        
        sbClient.auth.onAuthStateChange(async (event, session) => {
          currentUser = session?.user || null;
          updateAuthUI();
          if (currentUser) {
            const { data } = await sbClient.from('user_portfolios').select('portfolio_data').eq('user_id', currentUser.id).maybeSingle();
            if (data && data.portfolio_data) {
              parseCloudData(data.portfolio_data);
            }
            document.getElementById('syncStatus').innerText = '已同步雲端';
          }
        });

        const { data: { session } } = await sbClient.auth.getSession();
        currentUser = session?.user || null;
        updateAuthUI();

        if (currentUser) {
          const { data } = await sbClient.from('user_portfolios').select('portfolio_data').eq('user_id', currentUser.id).maybeSingle();
          if (data && data.portfolio_data) {
            parseCloudData(data.portfolio_data);
          }
          document.getElementById('syncStatus').innerText = '已同步雲端';
        } else {
          document.getElementById('syncStatus').innerText = '已就緒 (未登入)';
        }
      } catch (err) {
        document.getElementById('syncStatus').innerText = '單機離線模式';
      }
    }

    function parseCloudData(fetchedData) {
      if (fetchedData.twStocks && fetchedData.usStocks) {
        cloudData = fetchedData;
      } else if (fetchedData.stocks) {
        cloudData = { 
          twStocks: {}, 
          usStocks: { 
            "美股組合 1": { symbol: "AAPL", rate: "32", fee: "0" }, 
            "美股組合 2": { symbol: "NVDA", rate: "32", fee: "0" }, 
            "美股組合 3": { symbol: "TSLA", rate: "32", fee: "0" } 
          } 
        };
        Object.keys(fetchedData.stocks).forEach(k => {
          if (fetchedData.stocks[k].tw) cloudData.twStocks[k] = fetchedData.stocks[k].tw;
        });
        if (Object.keys(cloudData.twStocks).length === 0) cloudData.twStocks = { "台股預設": {} };
      }
      currentTwKey = Object.keys(cloudData.twStocks)[0];
      currentUsKey = Object.keys(cloudData.usStocks)[0];
      renderStockSelector('tw');
      renderStockSelector('us');
      loadStockToUI('tw', currentTwKey);
      loadStockToUI('us', currentUsKey);
    }

    function updateAuthUI() {
      const userInfoEl = document.getElementById('userInfo');
      const loginBtn = document.getElementById('loginBtn');
      const logoutBtn = document.getElementById('logoutBtn');

      if (currentUser) {
        userInfoEl.innerText = currentUser.email.split('@')[0];
        loginBtn.classList.add('hidden');
        logoutBtn.classList.remove('hidden');
      } else {
        userInfoEl.innerText = '未登入';
        loginBtn.classList.remove('hidden');
        logoutBtn.classList.add('hidden');
      }
    }

    init();
  </script>
