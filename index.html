<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台美股多次攤平與損益計算器</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-4 min-h-screen">
  <div class="max-w-md mx-auto space-y-4">
    <!-- Header -->
    <header class="text-center py-2">
      <h1 class="text-xl font-bold text-slate-900">台美股多次攤平與損益計算器</h1>
      <p class="text-xs text-slate-500">支援階梯式多次補倉試算</p>
    </header>

    <!-- 分頁切換按鈕 -->
    <div class="grid grid-cols-2 gap-2 bg-slate-200 p-1 rounded-xl">
      <button id="tabTwBtn" onclick="switchTab('tw')" class="py-2 text-sm font-semibold rounded-lg transition-all bg-white text-indigo-600 shadow-sm">
        🇹🇼 台股專用
      </button>
      <button id="tabUsBtn" onclick="switchTab('us')" class="py-2 text-sm font-semibold rounded-lg transition-all text-slate-600">
        🇺🇸 美股專用
      </button>
    </div>

    <!-- ================= 🇹🇼 台股介面 ================= -->
    <div id="twView" class="space-y-4">
      <!-- 參數設定：台股手續費與折扣 -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
        <h2 class="font-semibold text-sm text-indigo-600">台股交易設定</h2>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">手續費折數 (例: 0.6)</label>
            <input id="twDiscount" type="number" step="0.01" placeholder="例如: 0.6" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">手續費低消 (元)</label>
            <input id="twMinFee" type="number" placeholder="例如: 20" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>
      </div>

      <!-- 現有持股狀況 -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
        <h2 class="font-semibold text-sm text-indigo-600">1. 現有持股狀況 (台股)</h2>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">現有股數 (N1)</label>
            <input id="tw_n1" type="number" placeholder="例如: 60" class="tw-input w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">現有均價 (P1)</label>
            <input id="tw_p1" type="number" step="0.01" placeholder="例如: 2693.82" class="tw-input w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>

        <!-- 手動對齊損益率欄位 -->
        <div class="pt-2 border-t border-slate-100">
          <label class="block text-xs font-medium text-indigo-600 mb-1 font-semibold">手動對齊 App 未實現損益率 (%)</label>
          <input id="tw_manualPnlPct" type="number" step="0.01" placeholder="例: -24.24 或 -23.81" class="tw-input w-full border border-indigo-200 bg-indigo-50/50 rounded-lg p-2 text-sm font-bold text-indigo-700 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        
        <div class="pt-2 border-t border-slate-100">
          <label class="block text-xs font-medium text-slate-600 mb-1">前日收盤價</label>
          <div class="flex items-center gap-3">
            <input id="tw_prevClose" type="number" step="0.01" placeholder="輸入前收價" class="tw-input w-1/2 border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-slate-50">
            <div class="w-1/2 text-right">
              <div class="text-[10px] text-slate-500 mb-0.5">未實現損益 (依前收)</div>
              <div id="tw_prevPnlDisplay" class="font-bold text-sm text-slate-400">-%</div>
            </div>
          </div>
        </div>
        <div class="pt-2">
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs font-medium text-slate-600">目前最新股價</label>
            <label class="flex items-center text-xs text-slate-500 cursor-pointer select-none">
              <input id="tw_sameAsPrev" type="checkbox" class="mr-1 rounded text-indigo-600 focus:ring-indigo-500"> 同前收價
            </label>
          </div>
          <div class="flex items-center gap-3">
            <input id="tw_currentPrice" type="number" step="0.01" placeholder="輸入目前市價" class="tw-input w-1/2 border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-slate-50">
            <div class="w-1/2 text-right">
              <div class="text-[10px] text-slate-500 mb-0.5">未實現損益 (現有)</div>
              <div id="tw_pnlDisplay" class="font-bold text-sm text-slate-400">-%</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 多次補倉規劃 -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="font-semibold text-sm text-indigo-600">2. 多次補倉規劃 (台股)</h2>
          <div class="space-x-1">
            <button onclick="adjustDCA('tw', 1)" class="bg-indigo-50 text-indigo-600 text-xs px-2 py-1 rounded font-bold hover:bg-indigo-100">+ 增加一次</button>
            <button onclick="adjustDCA('tw', -1)" class="bg-slate-100 text-slate-600 text-xs px-2 py-1 rounded font-bold hover:bg-slate-200">- 減少</button>
          </div>
        </div>
        <div id="twDcaContainer" class="space-y-3 pt-2">
          <!-- 動態產生的補倉區塊會在這裡 -->
        </div>
      </div>

      <!-- 多次補倉計算結果 -->
      <div class="space-y-3">
        <h2 class="font-semibold text-sm text-slate-700 px-1">多次補倉試算結果</h2>
        <div id="twResultsContainer" class="space-y-3">
          <!-- 逐筆試算結果卡片 -->
        </div>
      </div>
    </div>


    <!-- ================= 🇺🇸 美股介面 ================= -->
    <div id="usView" class="space-y-4 hidden">
      <!-- 參數設定：匯率與美股手續費 -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
        <h2 class="font-semibold text-sm text-teal-600">美股交易設定</h2>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">美金匯率 (TWD)</label>
            <input id="us_exchangeRate" type="number" step="0.01" placeholder="例如: 32.5" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-teal-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">單筆手續費 (USD)</label>
            <input id="us_fee" type="number" step="0.01" placeholder="例如: 15" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-teal-500 outline-none">
          </div>
        </div>
      </div>

      <!-- 現有持股狀況 -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
        <h2 class="font-semibold text-sm text-teal-600">1. 現有持股狀況 (美股)</h2>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">現有股數 (N1)</label>
            <input id="us_n1" type="number" placeholder="例如: 100" class="us-input w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-teal-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">現有均價 ($ P1)</label>
            <input id="us_p1" type="number" step="0.01" placeholder="例如: 150" class="us-input w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-teal-500 outline-none">
          </div>
        </div>
        <div class="pt-2 border-t border-slate-100">
          <label class="block text-xs font-medium text-slate-600 mb-1">前日收盤價 ($)</label>
          <div class="flex items-center gap-3">
            <input id="us_prevClose" type="number" step="0.01" placeholder="輸入前收價" class="us-input w-1/2 border rounded-lg p-2 text-sm focus:ring-2 focus:ring-teal-500 outline-none bg-slate-50">
            <div class="w-1/2 text-right">
              <div class="text-[10px] text-slate-500 mb-0.5">未實現損益 (依前收)</div>
              <div id="us_prevPnlDisplay" class="font-bold text-sm text-slate-400">-%</div>
            </div>
          </div>
        </div>
        <div class="pt-2">
          <label class="block text-xs font-medium text-slate-600 mb-1">目前最新股價 ($)</label>
          <div class="flex items-center gap-3">
            <input id="us_currentPrice" type="number" step="0.01" placeholder="輸入目前市價" class="us-input w-1/2 border rounded-lg p-2 text-sm focus:ring-2 focus:ring-teal-500 outline-none bg-slate-50">
            <div class="w-1/2 text-right">
              <div class="text-[10px] text-slate-500 mb-0.5">未實現損益 (現有)</div>
              <div id="us_pnlDisplay" class="font-bold text-sm text-slate-400">-%</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 多次補倉規劃 -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="font-semibold text-sm text-teal-600">2. 多次補倉規劃 (美股)</h2>
          <div class="space-x-1">
            <button onclick="adjustDCA('us', 1)" class="bg-teal-50 text-teal-600 text-xs px-2 py-1 rounded font-bold hover:bg-teal-100">+ 增加一次</button>
            <button onclick="adjustDCA('us', -1)" class="bg-slate-100 text-slate-600 text-xs px-2 py-1 rounded font-bold hover:bg-slate-200">- 減少</button>
          </div>
        </div>
        <div id="usDcaContainer" class="space-y-3 pt-2">
          <!-- 動態產生的補倉區塊會在這裡 -->
        </div>
      </div>

      <!-- 多次補倉計算結果 -->
      <div class="space-y-3">
        <h2 class="font-semibold text-sm text-slate-700 px-1">多次補倉試算結果</h2>
        <div id="usResultsContainer" class="space-y-3">
          <!-- 逐筆試算結果卡片 -->
        </div>
      </div>
    </div>
  </div>

  <script>
    let twDcaCount = 3;
    let usDcaCount = 3;

    function switchTab(type) {
      const twView = document.getElementById('twView');
      const usView = document.getElementById('usView');
      const twBtn = document.getElementById('tabTwBtn');
      const usBtn = document.getElementById('tabUsBtn');

      if (type === 'tw') {
        twView.classList.remove('hidden');
        usView.classList.add('hidden');
        twBtn.className = "py-2 text-sm font-semibold rounded-lg transition-all bg-white text-indigo-600 shadow-sm";
        usBtn.className = "py-2 text-sm font-semibold rounded-lg transition-all text-slate-600";
      } else {
        usView.classList.remove('hidden');
        twView.classList.add('hidden');
        usBtn.className = "py-2 text-sm font-semibold rounded-lg transition-all bg-white text-teal-600 shadow-sm";
        twBtn.className = "py-2 text-sm font-semibold rounded-lg transition-all text-slate-600";
      }
    }

    function formatMoney(num) {
      if (isNaN(num) || !isFinite(num)) return '0';
      return Math.round(num).toLocaleString('en-US');
    }

    function formatPrice(num) {
      if (isNaN(num) || !isFinite(num)) return '0.00';
      return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function copyPrice(type) {
      const currentPrice = document.getElementById(`${type}_currentPrice`).value;
      if (currentPrice) {
        // 將最新市價帶入第一次補倉價格中
        const firstP2 = document.getElementById(`${type}_dca_p_0`);
        if (firstP2) firstP2.value = currentPrice;
        if (type === 'tw') calculateTw();
        else calculateUs();
      }
    }

    function calcTwBuyFee(price, shares, discount, minFee) {
      const rawFee = price * shares * 0.001425 * discount;
      return Math.max(rawFee, minFee);
    }

    // 初始化動態產出多次補倉輸入欄位
    function initDCAInputs(type) {
      const container = document.getElementById(`${type}DcaContainer`);
      const count = type === 'tw' ? twDcaCount : usDcaCount;
      container.innerHTML = '';

      for (let i = 0; i < count; i++) {
        const div = document.createElement('div');
        div.className = "p-3 bg-slate-50 rounded-lg border border-slate-200 space-y-2";
        div.innerHTML = `
          <div class="flex justify-between items-center text-xs font-bold text-slate-700">
            <span>第 ${i + 1} 次加碼</span>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] text-slate-500 mb-0.5">預計買入價</label>
              <input id="${type}_dca_p_${i}" type="number" step="0.01" placeholder="價格" class="${type}-input w-full border rounded p-1.5 text-xs bg-white outline-none">
            </div>
            <div>
              <label class="block text-[10px] text-slate-500 mb-0.5">加碼股數</label>
              <input id="${type}_dca_n_${i}" type="number" placeholder="股數" class="${type}-input w-full border rounded p-1.5 text-xs bg-white outline-none">
            </div>
          </div>
        `;
        container.appendChild(div);
      }

      // 重新綁定監聽事件
      document.querySelectorAll(`.${type}-input`).forEach(el => {
        el.addEventListener('input', () => {
          if (type === 'tw') calculateTw();
          else calculateUs();
        });
      });
    }

    function adjustDCA(type, delta) {
      if (type === 'tw') {
        twDcaCount = Math.max(1, twDcaCount + delta);
        initDCAInputs('tw');
        calculateTw();
      } else {
        usDcaCount = Math.max(1, usDcaCount + delta);
        initDCAInputs('us');
        calculateUs();
      }
    }

    // ---------------- 台股多次計算核心 ----------------
    function calculateTw() {
      const n1 = parseFloat(document.getElementById('tw_n1').value) || 0;
      const p1 = parseFloat(document.getElementById('tw_p1').value) || 0;
      const manualPnlPct = parseFloat(document.getElementById('tw_manualPnlPct').value);
      let currentPrice = parseFloat(document.getElementById('tw_currentPrice').value) || 0;
      const prevClose = parseFloat(document.getElementById('tw_prevClose').value) || 0;
      const sameAsPrev = document.getElementById('tw_sameAsPrev').checked;
      const discount = parseFloat(document.getElementById('twDiscount').value) || 0.6;
      const minFee = parseFloat(document.getElementById('twMinFee').value) || 20;

      const currentPriceEl = document.getElementById('tw_currentPrice');
      if (sameAsPrev && prevClose > 0) {
        currentPriceEl.value = prevClose;
        currentPriceEl.disabled = true;
        currentPriceEl.classList.add('bg-slate-100', 'text-slate-400');
        currentPrice = prevClose;
      } else {
        currentPriceEl.disabled = false;
        currentPriceEl.classList.remove('bg-slate-100', 'text-slate-400');
      }

      const displayPnlPct = !isNaN(manualPnlPct) ? manualPnlPct : (p1 > 0 && currentPrice > 0 ? ((currentPrice - p1) / p1) * 100 : null);
      const pnlDisplayEl = document.getElementById('tw_pnlDisplay');
      if (displayPnlPct !== null) {
        pnlDisplayEl.className = `font-bold text-sm ${displayPnlPct >= 0 ? 'text-emerald-500' : 'text-rose-500'}`;
        pnlDisplayEl.innerText = `${displayPnlPct > 0 ? '+' : ''}${displayPnlPct.toFixed(2)}%`;
      } else {
        pnlDisplayEl.className = 'font-bold text-sm text-slate-400';
        pnlDisplayEl.innerText = '-%';
      }

      if (p1 > 0 && prevClose > 0) {
        const pct = ((prevClose - p1) / p1) * 100;
        document.getElementById('tw_prevPnlDisplay').className = `font-bold text-sm ${pct >= 0 ? 'text-emerald-500' : 'text-rose-500'}`;
        document.getElementById('tw_prevPnlDisplay').innerText = `${pct > 0 ? '+' : ''}${pct.toFixed(2)}%`;
      } else {
        document.getElementById('tw_prevPnlDisplay').className = 'font-bold text-sm text-slate-400';
        document.getElementById('tw_prevPnlDisplay').innerText = '-%';
      }

      // 開始逐筆遞迴計算多次補倉
      let currentTotalN = n1;
      let currentTotalCost = n1 * p1;
      const resultsContainer = document.getElementById('twResultsContainer');
      resultsContainer.innerHTML = '';

      for (let i = 0; i < twDcaCount; i++) {
        const p2 = parseFloat(document.getElementById(`tw_dca_p_${i}`).value) || 0;
        const n2 = parseFloat(document.getElementById(`tw_dca_n_${i}`).value) || 0;

        const card = document.createElement('div');
        card.className = "bg-slate-900 text-white p-4 rounded-xl shadow-md space-y-2";

        if (p2 <= 0 || n2 <= 0 || currentTotalN <= 0) {
          card.innerHTML = `
            <h3 class="text-xs text-indigo-400 font-bold uppercase tracking-wider">第 ${i + 1} 次加碼試算</h3>
            <p class="text-xs text-slate-400">請填寫完整的買入價與股數以進行試算</p>
          `;
        } else {
          const addBuyFee = calcTwBuyFee(p2, n2, discount, minFee);
          const addCostTotal = (n2 * p2) + addBuyFee;
          
          currentTotalN += n2;
          currentTotalCost += addCostTotal;
          const newAvgPrice = currentTotalCost / currentTotalN;

          let newPnlStr = '-';
          let newPrevPnlStr = '-';
          let pnlColor = 'text-slate-400';
          let prevPnlColor = 'text-slate-400';

          if (currentPrice > 0) {
            const pnlPct = ((currentPrice - newAvgPrice) / newAvgPrice) * 100;
            pnlColor = pnlPct >= 0 ? 'text-emerald-400' : 'text-rose-400';
            newPnlStr = `${pnlPct > 0 ? '+' : ''}${pnlPct.toFixed(2)}%`;
          }
          if (prevClose > 0) {
            const prevPnlPct = ((prevClose - newAvgPrice) / newAvgPrice) * 100;
            prevPnlColor = prevPnlPct >= 0 ? 'text-emerald-400' : 'text-rose-400';
            newPrevPnlStr = `${prevPnlPct > 0 ? '+' : ''}${prevPnlPct.toFixed(2)}%`;
          }

          card.innerHTML = `
            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
              <span class="text-xs text-indigo-400 font-bold uppercase tracking-wider">第 ${i + 1} 次加碼試算結果</span>
              <span class="text-xs text-cyan-300">累計總股數：${currentTotalN.toFixed(2)} 股</span>
            </div>
            <div class="flex justify-between items-center text-sm">
              <span class="text-slate-300">本筆投入金額 (含費)：</span>
              <span class="font-semibold text-white">$${formatMoney(addCostTotal)}</span>
            </div>
            <div class="flex justify-between items-center text-sm border-b border-slate-700 pb-2">
              <span class="text-slate-300">新平均成本價：</span>
              <span class="font-bold text-yellow-300">$${formatPrice(newAvgPrice)}</span>
            </div>
            <div class="flex justify-between items-center text-xs pt-1">
              <span class="text-slate-300">攤平後損益 (最新)：</span>
              <span class="font-bold ${pnlColor}">${newPnlStr}</span>
            </div>
            <div class="flex justify-between items-center text-xs">
              <span class="text-slate-300">攤平後損益 (依前收)：</span>
              <span class="font-bold ${prevPnlColor}">${newPrevPnlStr}</span>
            </div>
          `;
        }
        resultsContainer.appendChild(card);
      }
    }


    // ---------------- 美股多次計算核心 ----------------
    function calculateUs() {
      const n1 = parseFloat(document.getElementById('us_n1').value) || 0;
      const p1 = parseFloat(document.getElementById('us_p1').value) || 0;
      const currentPrice = parseFloat(document.getElementById('us_currentPrice').value) || 0;
      const prevClose = parseFloat(document.getElementById('us_prevClose').value) || 0;
      const rate = parseFloat(document.getElementById('us_exchangeRate').value) || 32.5;
      const fee = parseFloat(document.getElementById('us_fee').value) || 0;

      if (p1 > 0 && prevClose > 0) {
        const pct = ((prevClose - p1) / p1) * 100;
        document.getElementById('us_prevPnlDisplay').className = `font-bold text-sm ${pct >= 0 ? 'text-emerald-500' : 'text-rose-500'}`;
        document.getElementById('us_prevPnlDisplay').innerText = `${pct > 0 ? '+' : ''}${pct.toFixed(2)}%`;
      } else {
        document.getElementById('us_prevPnlDisplay').className = 'font-bold text-sm text-slate-400';
        document.getElementById('us_prevPnlDisplay').innerText = '-%';
      }

      if (p1 > 0 && currentPrice > 0) {
        const pct = ((currentPrice - p1) / p1) * 100;
        document.getElementById('us_pnlDisplay').className = `font-bold text-sm ${pct >= 0 ? 'text-emerald-500' : 'text-rose-500'}`;
        document.getElementById('us_pnlDisplay').innerText = `${pct > 0 ? '+' : ''}${pct.toFixed(2)}%`;
      } else {
        document.getElementById('us_pnlDisplay').className = 'font-bold text-sm text-slate-400';
        document.getElementById('us_pnlDisplay').innerText = '-%';
      }

      let currentTotalN = n1;
      let currentTotalCostUSD = n1 * p1;
      const resultsContainer = document.getElementById('usResultsContainer');
      resultsContainer.innerHTML = '';

      for (let i = 0; i < usDcaCount; i++) {
        const p2 = parseFloat(document.getElementById(`us_dca_p_${i}`).value) || 0;
        const n2 = parseFloat(document.getElementById(`us_dca_n_${i}`).value) || 0;

        const card = document.createElement('div');
        card.className = "bg-slate-900 text-white p-4 rounded-xl shadow-md space-y-2";

        if (p2 <= 0 || n2 <= 0 || currentTotalN <= 0) {
          card.innerHTML = `
            <h3 class="text-xs text-teal-400 font-bold uppercase tracking-wider">第 ${i + 1} 次加碼試算</h3>
            <p class="text-xs text-slate-400">請填寫完整的買入價與股數以進行試算</p>
          `;
        } else {
          const addCostUSD = (n2 * p2) + fee;
          currentTotalN += n2;
          currentTotalCostUSD += addCostUSD;
          const newAvgPrice = currentTotalCostUSD / currentTotalN;

          let newPnlStr = '-';
          let newPrevPnlStr = '-';
          let pnlColor = 'text-slate-400';
          let prevPnlColor = 'text-slate-400';

          if (currentPrice > 0) {
            const pnlPct = ((currentPrice - newAvgPrice) / newAvgPrice) * 100;
            pnlColor = pnlPct >= 0 ? 'text-emerald-400' : 'text-rose-400';
            newPnlStr = `${pnlPct > 0 ? '+' : ''}${pnlPct.toFixed(2)}%`;
          }
          if (prevClose > 0) {
            const prevPnlPct = ((prevClose - newAvgPrice) / newAvgPrice) * 100;
            prevPnlColor = prevPnlPct >= 0 ? 'text-emerald-400' : 'text-rose-400';
            newPrevPnlStr = `${prevPnlPct > 0 ? '+' : ''}${prevPnlPct.toFixed(2)}%`;
          }

          card.innerHTML = `
            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
              <span class="text-xs text-teal-400 font-bold uppercase tracking-wider">第 ${i + 1} 次加碼試算結果</span>
              <span class="text-xs text-teal-300">累計總股數：${currentTotalN.toFixed(2)} 股</span>
            </div>
            <div class="flex justify-between items-center text-sm">
              <span class="text-slate-300">本筆投入金額 (含費)：</span>
              <span class="font-semibold text-white">$${formatMoney(addCostUSD)} USD <span class="text-xs text-yellow-300">(約 NT$ ${formatMoney(addCostUSD * rate)})</span></span>
            </div>
            <div class="flex justify-between items-center text-sm border-b border-slate-700 pb-2">
              <span class="text-slate-300">新平均成本價：</span>
              <span class="font-bold text-yellow-300">$${formatPrice(newAvgPrice)} USD</span>
            </div>
            <div class="flex justify-between items-center text-xs pt-1">
              <span class="text-slate-300">攤平後損益 (最新)：</span>
              <span class="font-bold ${pnlColor}">${newPnlStr}</span>
            </div>
            <div class="flex justify-between items-center text-xs">
              <span class="text-slate-300">攤平後損益 (依前收)：</span>
              <span class="font-bold ${prevPnlColor}">${newPrevPnlStr}</span>
            </div>
          `;
        }
        resultsContainer.appendChild(card);
      }
    }

    // 基礎全域事件監聽
    ['tw_n1', 'tw_p1', 'tw_manualPnlPct', 'tw_prevClose', 'tw_currentPrice', 'twDiscount', 'twMinFee',
     'us_n1', 'us_p1', 'us_prevClose', 'us_currentPrice', 'us_exchangeRate', 'us_fee'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener('input', () => {
          calculateTw();
          calculateUs();
        });
      }
    });

    document.getElementById('tw_sameAsPrev').addEventListener('change', calculateTw);

    // 頁面初始化
    window.onload = () => {
      initDCAInputs('tw');
      initDCAInputs('us');
      calculateTw();
      calculateUs();
    };
  </script>
</body>
</html>
