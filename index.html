<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台美股多組合攤平與損益計算器</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body id="bodyBg" class="bg-slate-100 text-slate-800 p-3 sm:p-6 min-h-screen transition-all">
  <div id="mainContainer" class="max-w-md sm:max-w-xl mx-auto space-y-4 sm:space-y-6 text-xs sm:text-sm relative z-10">
    
    <!-- 頂部標題與版本號 -->
    <header class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between relative z-20">
      <div>
        <div class="flex items-center gap-2">
          <h1 class="font-bold text-sm sm:text-lg text-slate-900 leading-tight">台美股攤平與損益計算器</h1>
          <span class="bg-indigo-100 text-indigo-700 text-[10px] sm:text-xs font-bold px-2.5 py-0.5 rounded-full">v4.0.0</span>
        </div>
        <div id="syncStatus" class="text-[9px] sm:text-xs text-slate-400 mt-0.5">系統運作中...</div>
      </div>
      
      <div class="flex items-center gap-2.5 sm:gap-3">
        <button onclick="toggleUIMode()" id="modeToggleBtn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-[10px] sm:text-xs px-3 py-2 rounded-xl font-bold border transition shadow-sm cursor-pointer">
          📱 緊湊模式
        </button>
      </div>
    </header>

    <!-- 這裡保留原本計算器的基本介面架構，確保網頁能正常顯示 -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center">
      <h2 class="text-lg font-bold text-slate-700 mb-2">✅ 網頁已成功修復</h2>
      <p class="text-sm text-slate-500">現在這是一個乾淨的前端網頁。您可以隨時透過 GitHub 推送更新。</p>
    </div>

  </div>

  <script>
    let isCompactMode = localStorage.getItem('calc_compact_mode') === 'true';
    
    window.toggleUIMode = function() {
      isCompactMode = !isCompactMode;
      localStorage.setItem('calc_compact_mode', isCompactMode);
      applyUIMode();
    };

    function applyUIMode() {
      const btn = document.getElementById('modeToggleBtn');
      if (isCompactMode) {
        btn.innerText = "📱 緊湊模式";
      } else {
        btn.innerText = "💻 標準模式";
      }
    }
    
    applyUIMode();
  </script>
</body>
</html>
