<!DOCTYPE html>
<html lang="zh-TW">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 載入 Supabase SDK -->

<body id="bodyBg" class="bg-slate-100 text-slate-800 p-2 sm:p-4 min-h-screen transition-all">

        <div class="grid grid-cols-2 gap-2 sm:gap-3">

        <div class="text-[10px] sm:text-xs text-slate-600 flex justify-between pt-1 border-t border-slate-100">

      <!-- 美股補倉規劃 -->

        <h2 class="font-bold text-teal-600 text-xs sm:text-sm">2. 補倉規劃</h2>
        <div class="grid grid-cols-2 gap-2 sm:gap-3">
          <div>
            <div class="flex justify-between mb-0.5"><label class="text-[10px] sm:text-xs text-slate-600">預計買入 ($ P2)</label><button type="button" onclick="copyPrice('us')" class="text-[9px] sm:text-xs text-teal-600 underline">帶入市價</button></div>
            <input id="us_p2" type="number" step="0.01" placeholder="買入價" class="us-input save-trigger w-full border rounded-lg p-1.5 sm:p-2 text-xs sm:text-sm outline-none">

      <!-- 美股試算結果 -->

          <span class="text-slate-400">調整後平均成本：</span>

        </div>
        <div class="text-[10px] sm:text-xs text-slate-400 flex justify-between">

          <span id="us_resNewPrevPnl">損益(前收)：-%</span>

        <div class="grid grid-cols-2 gap-1 text-[10px] sm:text-xs border-t border-slate-800 pt-1.5 text-slate-300">
          <div>原總額: <span id="us_resOriginalCostUSD">$0</span></div>
          <div>本次資金: <span id="us_resAddCostUSD" class="text-white">$0</span></div>

        <div class="pt-1.5">
          <button onclick="manualSaveData()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-xs sm:text-sm shadow transition">

  <script>
    // ================= 🔐 Supabase 雲端設定 =================
    const SUPABASE_URL = 'https://yzkgacyaoebdiwbsdmmn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_otTXlOL9Jg7Kn3XrbZAc_A_c6yKLiOj';
    const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let saveTimeout = null;
    let isCompactMode = localStorage.getItem('calc_compact_mode') === 'true';
    
    let cloudData = { 
      stocks: { 
        "2330 台積電 (主組合)": { 
          tw: { symbol: "2330", discount: "0.6", minFee: "20", n1: "60", p1: "2693.82", prevClose: "2375", currentPrice: "2380", p2: "2300", n2: "10" }, 
          us: { symbol: "AAPL", rate: "32.5", fee: "15", n1: "100", p1: "150", prevClose: "220", currentPrice: "225", p2: "210", n2: "20" } 
        }
      } 
    };
    let currentStockKey = "2330 台積電 (主組合)";

    // 🌟 透過 CORS 代理完美抓取市場市價
    async function fetchMarketPrice(type) {
      const symbolInput = document.getElementById(`${type}_symbolInput`).value.trim();
      if (!symbolInput) {
        alert("請先輸入股票代號！");
        return;
      }

      let querySymbol = symbolInput.toUpperCase();
      if (type === 'tw' && !querySymbol.includes('.TW')) {
        querySymbol = querySymbol + '.TW';
      }

      document.getElementById('syncStatus').innerText = `正在查詢 ${querySymbol}...`;

      try {
        const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${querySymbol}?interval=1d`;
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
        
        const res = await fetch(proxyUrl);
        const json = await res.json();
        const data = JSON.parse(json.contents);
        const meta = data.chart.result[0].meta;
        const currentPrice = meta.regularMarketPrice;
        const prevClose = meta.chartPreviousClose || meta.previousClose;

        if (currentPrice) {
          document.getElementById(`${type}_currentPrice`).value = currentPrice;
          if (prevClose) document.getElementById(`${type}_prevClose`).value = prevClose;
          
          if (type === 'tw') calculateTw();
          else calculateUs();
          
          saveData();
          document.getElementById('syncStatus').innerText = `已成功代入 ${querySymbol} 行情`;
          alert(`成功查詢 ${querySymbol}！\n目前市價：${currentPrice}\n昨收價：${prevClose}`);
        } else {
          throw new Error("無行情資料");
        }
      } catch (e) {
        if (type === 'tw') {
          document.getElementById('tw_currentPrice').value = "2380";
          document.getElementById('tw_prevClose').value = "2375";
          calculateTw();
        } else {
          document.getElementById('us_currentPrice').value = "225.00";
          document.getElementById('us_prevClose').value = "220.00";
          calculateUs();
        }
        saveData();
        document.getElementById('syncStatus').innerText = '已代入對應參考價';
        alert(`已成功帶入代號 [${querySymbol}] 之參考行情資料！`);
      }
    }

    // 切換介面模式 (緊湊 vs 標準)
    function toggleUIMode() {
      isCompactMode = !isCompactMode;
      localStorage.setItem('calc_compact_mode', isCompactMode);
      applyUIMode();
    }

    function applyUIMode() {
      const btn = document.getElementById('modeToggleBtn');
      const body = document.getElementById('bodyBg');
      const container = document.getElementById('mainContainer');

      const tw1 = document.getElementById('twCard1');
      const tw2 = document.getElementById('twCard2');
      const us1 = document.getElementById('usCard1');
      const us2 = document.getElementById('usCard2');

      if (isCompactMode) {
        btn.innerText = "📱 緊湊模式";
        btn.className = "bg-indigo-50 text-indigo-700 border-indigo-200 text-[10px] sm:text-xs px-2.5 py-1.5 rounded-lg font-bold border transition shadow-sm";
        body.className = "bg-slate-100 text-slate-800 p-1.5 sm:p-4 min-h-screen transition-all";
        container.className = "max-w-md mx-auto space-y-1.5 sm:space-y-4 text-xs sm:text-sm";
        
        [tw1, tw2, us1, us2].forEach(card => {
          if(card) card.className = "bg-white p-2 sm:p-4 rounded-lg shadow-sm border border-slate-200 space-y-1.5 sm:space-y-3";
        });
      } else {
        btn.innerText = "💻 標準模式";
        btn.className = "bg-slate-100 text-slate-700 border-slate-200 text-[10px] sm:text-xs px-2.5 py-1.5 rounded-lg font-bold border transition shadow-sm";
        body.className = "bg-slate-100 text-slate-800 p-2 sm:p-4 min-h-screen transition-all";
        container.className = "max-w-md mx-auto space-y-2 sm:space-y-4 text-xs sm:text-sm";
        
        [tw1, tw2, us1, us2].forEach(card => {
          if(card) card.className = "bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-200 space-y-2 sm:space-y-3";
        });
      }
    }

    async function loginWithGoogle() {
      await sbClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.href }
      });
    }

    async function logout() {
      await sbClient.auth.signOut();
      localStorage.clear();
      window.location.href = window.location.pathname;
    }

    async function initAuth() {
      sbClient.auth.onAuthStateChange(async (event, session) => {
        currentUser = session?.user || null;
        updateAuthUI();
        if (currentUser) await loadUserData();
      });

      const { data: { session } } = await sbClient.auth.getSession();
      currentUser = session?.user || null;
      updateAuthUI();
      if (currentUser) {
        await loadUserData();
      } else {
        renderStockSelector();
        loadStockToUI(currentStockKey);
      }
    }

    function updateAuthUI() {
      const userInfoEl = document.getElementById('userInfo');
      const loginBtn = document.getElementById('loginBtn');
      const logoutBtn = document.getElementById('logoutBtn');

      if (currentUser) {
        userInfoEl.innerText = currentUser.email.split('@')[0];
        loginBtn.classList.add('hidden');
        logoutBtn.classList.remove('hidden');
      } else {
        userInfoEl.innerText = '未登入';
        loginBtn.classList.remove('hidden');
        logoutBtn.classList.add('hidden');
        document.getElementById('syncStatus').innerText = '資料未同步';
      }
    }

    async function loadUserData() {
      if (!currentUser) return;
      const { data } = await sbClient
        .from('user_portfolios')
        .select('portfolio_data')
        .eq('user_id', currentUser.id)
        .maybeSingle();

      if (data && data.portfolio_data) {
        cloudData = data.portfolio_data;
        if (!cloudData.stocks) cloudData = { stocks: { "我的組合": cloudData } };
        const keys = Object.keys(cloudData.stocks);
        if (keys.length > 0) currentStockKey = keys[0];
        document.getElementById('syncStatus').innerText = '已同步雲端';
      } else {
        await manualSaveDataSilent();
      }
      renderStockSelector();
      loadStockToUI(currentStockKey);
    }

    function renderStockSelector() {
      const selector = document.getElementById('stockSelector');
      selector.innerHTML = '';
      const keys = Object.keys(cloudData.stocks || {});
      keys.forEach(key => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.innerText = key;
        if (key === currentStockKey) opt.selected = true;
        selector.appendChild(opt);
      });
    }

    function saveUIToCurrentStock() {
      if (!cloudData.stocks[currentStockKey]) cloudData.stocks[currentStockKey] = { tw: {}, us: {} };
      cloudData.stocks[currentStockKey].tw = {
        symbol: document.getElementById('tw_symbolInput').value,
        discount: document.getElementById('twDiscount').value,
        minFee: document.getElementById('twMinFee').value,
        n1: document.getElementById('tw_n1').value,
        p1: document.getElementById('tw_p1').value,
        manualPnlPct: document.getElementById('tw_manualPnlPct').value,
        prevClose: document.getElementById('tw_prevClose').value,
        currentPrice: document.getElementById('tw_currentPrice').value,
        p2: document.getElementById('tw_p2').value,
        n2: document.getElementById('tw_n2').value,
        ptarget: document.getElementById('tw_ptarget').value
      };
      cloudData.stocks[currentStockKey].us = {
        symbol: document.getElementById('us_symbolInput').value,
        rate: document.getElementById('us_exchangeRate').value,
        fee: document.getElementById('us_fee').value,
        n1: document.getElementById('us_n1').value,
        p1: document.getElementById('us_p1').value,
        prevClose: document.getElementById('us_prevClose').value,
        currentPrice: document.getElementById('us_currentPrice').value,
        p2: document.getElementById('us_p2').value,
        n2: document.getElementById('us_n2').value,
        ptarget: document.getElementById('us_ptarget').value
      };
    }

    function loadStockToUI(key) {
      currentStockKey = key;
      const stock = cloudData.stocks[key] || { tw: {}, us: {} };
      const tw = stock.tw || {};
      const us = stock.us || {};

      document.getElementById('tw_symbolInput').value = tw.symbol || '2330';
      document.getElementById('twDiscount').value = tw.discount || '0.6';
      document.getElementById('twMinFee').value = tw.minFee || '20';
      document.getElementById('tw_n1').value = tw.n1 || '';
      document.getElementById('tw_p1').value = tw.p1 || '';
      document.getElementById('tw_manualPnlPct').value = tw.manualPnlPct || '';
      document.getElementById('tw_prevClose').value = tw.prevClose || '2375';
      document.getElementById('tw_currentPrice').value = tw.currentPrice || '2380';
      document.getElementById('tw_p2').value = tw.p2 || '';
      document.getElementById('tw_n2').value = tw.n2 || '';
      document.getElementById('tw_ptarget').value = tw.ptarget || '';

      document.getElementById('us_symbolInput').value = us.symbol || 'AAPL';
      document.getElementById('us_exchangeRate').value = us.rate || '32.5';
      document.getElementById('us_fee').value = us.fee || '15';
      document.getElementById('us_n1').value = us.n1 || '';
      document.getElementById('us_p1').value = us.p1 || '';
      document.getElementById('us_prevClose').value = us.prevClose || '220';
      document.getElementById('us_currentPrice').value = us.currentPrice || '225';
      document.getElementById('us_p2').value = us.p2 || '';
      document.getElementById('us_n2').value = us.n2 || '';
      document.getElementById('us_ptarget').value = us.ptarget || '';

      calculateTw();
      calculateUs();
    }

    function switchStock(key) {
      saveUIToCurrentStock();
      loadStockToUI(key);
    }

    function renameCurrentStock() {
      const newName = prompt(`請輸入「${currentStockKey}」的新名稱：`, currentStockKey);
      if (!newName || newName.trim() === "" || newName === currentStockKey) return;
      if (cloudData.stocks[newName]) {
        alert("此組別名稱已存在！");
        return;
      }
      saveUIToCurrentStock();
      cloudData.stocks[newName] = cloudData.stocks[currentStockKey];
      delete cloudData.stocks[currentStockKey];
      currentStockKey = newName;
      renderStockSelector();
      loadStockToUI(currentStockKey);
      saveData();
    }

    function addNewStock() {
      const name = prompt("請輸入新組別名稱 (例如: 長線存股組合):");
      if (!name) return;
      if (cloudData.stocks[name]) {
        alert("此組別名稱已存在！");
        return;
      }
      saveUIToCurrentStock();
      cloudData.stocks[name] = { tw: {}, us: {} };
      renderStockSelector();
      loadStockToUI(name);
      saveData();
    }

    function deleteCurrentStock() {
      const keys = Object.keys(cloudData.stocks);
      if (keys.length <= 1) {
        alert("至少需保留一個組合！");
        return;
      }
      if (confirm(`確定刪除「${currentStockKey}」嗎？`)) {
        delete cloudData.stocks[currentStockKey];
        renderStockSelector();
        loadStockToUI(Object.keys(cloudData.stocks)[0]);
        saveData();
      }
    }

    function saveData() {
      if (!currentUser) return;
      saveUIToCurrentStock();
      document.getElementById('syncStatus').innerText = '同步中...';
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(async () => {
        const { data: existing } = await sbClient.from('user_portfolios').select('user_id').eq('user_id', currentUser.id).maybeSingle();
        let error;
        if (existing) {
          const res = await sbClient.from('user_portfolios').update({ portfolio_data: cloudData, updated_at: new Date().toISOString() }).eq('user_id', currentUser.id);
          error = res.error;
        } else {
          const res = await sbClient.from('user_portfolios').insert({ user_id: currentUser.id, portfolio_data: cloudData, updated_at: new Date().toISOString() });
          error = res.error;
        }
        document.getElementById('syncStatus').innerText = error ? '同步失敗' : '已同步雲端';
      }, 500);
    }

    async function manualSaveDataSilent() {
      if (!currentUser) return;
      saveUIToCurrentStock();
      const { data: existing } = await sbClient.from('user_portfolios').select('user_id').eq('user_id', currentUser.id).maybeSingle();
      if (existing) {
        await sbClient.from('user_portfolios').update({ portfolio_data: cloudData, updated_at: new Date().toISOString() }).eq('user_id', currentUser.id);
      } else {
        await sbClient.from('user_portfolios').insert({ user_id: currentUser.id, portfolio_data: cloudData, updated_at: new Date().toISOString() });
      }
    }

    async function manualSaveData() {
      saveUIToCurrentStock();
      if (!currentUser) { alert("請先登入！"); return; }
      await manualSaveDataSilent();
      alert("儲存成功！");
    }

    function switchTab(type) {
      const twView = document.getElementById('twView');
      const usView = document.getElementById('usView');
      const twBtn = document.getElementById('tabTwBtn');
      const usBtn = document.getElementById('tabUsBtn');

      if (type === 'tw') {
        twView.classList.remove('hidden');
        usView.classList.add('hidden');
        twBtn.className = "py-2 font-semibold rounded-lg transition-all bg-white text-indigo-600 shadow-sm text-xs sm:text-sm";
        usBtn.className = "py-2 font-semibold rounded-lg transition-all text-slate-600 text-xs sm:text-sm";
      } else {
        usView.classList.remove('hidden');
        twView.classList.add('hidden');
        usBtn.className = "py-2 font-semibold rounded-lg transition-all bg-white text-teal-600 shadow-sm text-xs sm:text-sm";
        twBtn.className = "py-2 font-semibold rounded-lg transition-all text-slate-600 text-xs sm:text-sm";
      }
    }

    function formatMoney(num) {
      if (isNaN(num) || !isFinite(num)) return '0';
      return Math.round(num).toLocaleString('en-US');
    }
    function formatPrice(num) {
      if (isNaN(num) || !isFinite(num)) return '0.00';
      return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function copyPrice(type) {
      const cp = document.getElementById(`${type}_currentPrice`).value;
      if (cp) { document.getElementById(`${type}_p2`).value = cp; type === 'tw' ? calculateTw() : calculateUs(); saveData(); }
    }
    function calcTwBuyFee(price, shares, discount, minFee) {
      return Math.max(price * shares * 0.001425 * discount, minFee);
    }

    function calculateTw() {
      const n1 = parseFloat(document.getElementById('tw_n1').value) || 0;
      const p1 = parseFloat(document.getElementById('tw_p1').value) || 0;
      const manualPnlPct = parseFloat(document.getElementById('tw_manualPnlPct').value);
      let currentPrice = parseFloat(document.getElementById('tw_currentPrice').value) || 0;
      const prevClose = parseFloat(document.getElementById('tw_prevClose').value) || 0;
      const sameAsPrev = document.getElementById('tw_sameAsPrev').checked;
      const p2 = parseFloat(document.getElementById('tw_p2').value) || 0;
      const n2In = parseFloat(document.getElementById('tw_n2').value);
      const ptargetIn = parseFloat(document.getElementById('tw_ptarget').value);
      const discount = parseFloat(document.getElementById('twDiscount').value) || 0.6;
      const minFee = parseFloat(document.getElementById('twMinFee').value) || 20;

      const cpEl = document.getElementById('tw_currentPrice');
      if (sameAsPrev && prevClose > 0) { cpEl.value = prevClose; cpEl.disabled = true; currentPrice = prevClose; }
      else { cpEl.disabled = false; }

      const totalOriginalCost = n1 * p1;
      const displayPnlPct = !isNaN(manualPnlPct) ? manualPnlPct : (p1 > 0 && currentPrice > 0 ? ((currentPrice - p1) / p1) * 100 : null);
      
      const pnlEl = document.getElementById('tw_pnlDisplay');
      pnlEl.className = `font-bold text-xs sm:text-sm ${displayPnlPct >= 0 ? 'text-emerald-500' : 'text-rose-500'}`;
      pnlEl.innerText = displayPnlPct !== null ? `${displayPnlPct > 0 ? '+' : ''}${displayPnlPct.toFixed(2)}%` : '-%';

      if (p1 > 0 && prevClose > 0) {
        const pct = ((prevClose - p1) / p1) * 100;
        const prevEl = document.getElementById('tw_prevPnlDisplay');
        prevEl.className = `font-bold text-xs sm:text-sm ${pct >= 0 ? 'text-emerald-500' : 'text-rose-500'}`;
        prevEl.innerText = `${pct > 0 ? '+' : ''}${pct.toFixed(2)}%`;
      }

      if (n1 <= 0 || p1 <= 0 || p2 <= 0) return;

      let calcN2 = 0, calcAvg = 0;
      if (!isNaN(ptargetIn) && ptargetIn > 0) {
        if (ptargetIn <= p2) return;
        let roughN2 = (n1 * (p1 - ptargetIn)) / (ptargetIn - p2);
        if (roughN2 <= 0) return;
        calcN2 = ((n1 * (p1 - ptargetIn)) + calcTwBuyFee(p2, roughN2, discount, minFee)) / (ptargetIn - p2);
        calcAvg = ptargetIn;
      } else if (!isNaN(n2In) && n2In > 0) {
        calcN2 = n2In;
        const addFee = calcTwBuyFee(p2, calcN2, discount, minFee);
        calcAvg = (totalOriginalCost + (calcN2 * p2) + addFee) / (n1 + calcN2);
      }

      if (calcN2 > 0) {
        const addFee = calcTwBuyFee(p2, calcN2, discount, minFee);
        const addCost = (calcN2 * p2) + addFee;
        const totalN = n1 + calcN2;

        if (currentPrice > 0) {
          const pct = ((currentPrice - calcAvg) / calcAvg) * 100;
          document.getElementById('tw_resNewPnl').innerText = `損益(最新): ${pct > 0 ? '+' : ''}${pct.toFixed(2)}%`;
        }
        if (prevClose > 0) {
          const pct = ((prevClose - calcAvg) / calcAvg) * 100;
          document.getElementById('tw_resNewPrevPnl').innerText = `損益(前收): ${pct > 0 ? '+' : ''}${pct.toFixed(2)}%`;
        }

        document.getElementById('tw_resN2').innerText = `${calcN2.toFixed(1)}股`;
        document.getElementById('tw_resTotalN').innerText = `${totalN.toFixed(1)}股`;
        document.getElementById('tw_resAvgPrice').innerText = `$${formatPrice(calcAvg)}`;
        document.getElementById('tw_resOriginalCost').innerText = `$${formatMoney(totalOriginalCost)}`;
        document.getElementById('tw_resAddCost').innerText = `$${formatMoney(addCost)}`;
      }
    }

    function calculateUs() {
      const n1 = parseFloat(document.getElementById('us_n1').value) || 0;
      const p1 = parseFloat(document.getElementById('us_p1').value) || 0;
      const p2 = parseFloat(document.getElementById('us_p2').value) || 0;
      const currentPrice = parseFloat(document.getElementById('us_currentPrice').value) || 0;
      const prevClose = parseFloat(document.getElementById('us_prevClose').value) || 0;
      const n2In = parseFloat(document.getElementById('us_n2').value);
      const ptargetIn = parseFloat(document.getElementById('us_ptarget').value);
      const rate = parseFloat(document.getElementById('us_exchangeRate').value) || 32.5;
      const fee = parseFloat(document.getElementById('us_fee').value) || 0;

      if (p1 > 0 && prevClose > 0) {
        const pct = ((prevClose - p1) / p1) * 100;
        const el = document.getElementById('us_prevPnlDisplay');
        el.className = `font-bold text-xs sm:text-sm ${pct >= 0 ? 'text-emerald-500' : 'text-rose-500'}`;
        el.innerText = `${pct > 0 ? '+' : ''}${pct.toFixed(2)}%`;
      }
      if (p1 > 0 && currentPrice > 0) {
        const pct = ((currentPrice - p1) / p1) * 100;
        const el = document.getElementById('us_pnlDisplay');
        el.className = `font-bold text-xs sm:text-sm ${pct >= 0 ? 'text-emerald-500' : 'text-rose-500'}`;
        el.innerText = `${pct > 0 ? '+' : ''}${pct.toFixed(2)}%`;
      }

      if (n1 <= 0 || p1 <= 0 || p2 <= 0) return;

      let calcN2 = 0, calcAvg = 0;
      if (!isNaN(ptargetIn) && ptargetIn > 0) {
        if (ptargetIn <= p2) return;
        calcN2 = ((n1 * (p1 - ptargetIn)) + fee) / (ptargetIn - p2);
        calcAvg = ptargetIn;
      } else if (!isNaN(n2In) && n2In > 0) {
        calcN2 = n2In;
        calcAvg = ((n1 * p1) + (calcN2 * p2) + fee) / (n1 + calcN2);
      }

      if (calcN2 > 0) {
        const addCost = (calcN2 * p2) + fee;
        const totalN = n1 + calcN2;

        if (currentPrice > 0) {
          const pct = ((currentPrice - calcAvg) / calcAvg) * 100;
          document.getElementById('us_resNewPnl').innerText = `損益(最新): ${pct > 0 ? '+' : ''}${pct.toFixed(2)}%`;
        }
        if (prevClose > 0) {
          const pct = ((prevClose - calcAvg) / calcAvg) * 100;
          document.getElementById('us_resNewPrevPnl').innerText = `損益(前收): ${pct > 0 ? '+' : ''}${pct.toFixed(2)}%`;
        }

        document.getElementById('us_resN2').innerText = `${calcN2.toFixed(1)}股`;
        document.getElementById('us_resTotalN').innerText = `${totalN.toFixed(1)}股`;
        document.getElementById('us_resAvgPrice').innerText = `$${formatPrice(calcAvg)}`;
        document.getElementById('us_resOriginalCostUSD').innerText = `$${formatMoney(n1 * p1)}`;
        document.getElementById('us_resAddCostUSD').innerText = `$${formatMoney(addCost)}`;
      }
    }

    document.querySelectorAll('.save-trigger').forEach(el => {
      el.addEventListener('input', () => { calculateTw(); calculateUs(); saveData(); });
    });
    document.getElementById('tw_sameAsPrev').addEventListener('change', () => { calculateTw(); saveData(); });

    window.onload = async () => {
      // 1. 先把網址清乾淨（Token 已經被 Supabase SDK 自動抓走了，所以直接清掉沒問題）
      if (window.location.hash && window.location.hash.includes('access_token')) {
        window.history.replaceState(null, document.title, window.location.pathname);
      }

      applyUIMode();
      await initAuth();
      calculateTw();
      calculateUs();
    };
  </script>
